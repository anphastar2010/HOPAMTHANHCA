<!DOCTYPE html>
<html lang="vi">
<head>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>Hợp Âm Thờ Phượng</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f9f9f9;
}

header {
  background: #1976d2;
  color: white;
  padding: 12px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.controls {
  display: flex;
  gap: 8px;
  padding: 10px;
}

select, input {
  flex: 1;
  padding: 10px;
  font-size: 16px;
}

.song-title {
  font-size: 22px;
  font-weight: bold;
  padding: 12px 12px 4px;
}

.song-artist {
  padding: 0 12px 12px;
  font-size: 14px;
  color: #666;
}

.song-content {
  padding: 14px;
  font-size: 18px;
  line-height: 1.75;
}

.song-line {
  margin-bottom: 6px;
}

/* ===== HỢP ÂM ===== */
.chord {
  color: #0d47a1;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 19px;
  letter-spacing: 0.5px;
}
/* ===== DANH SÁCH ===== */
.song-list {
  border-top: 1px solid #ddd;
}

.song-item {
  padding: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.song-item:hover {
  background: #e3f2fd;
}
</style>
</head>

<body>

<header>🎶 Hợp Âm Thờ Phượng</header>

<div class="controls-container" style="padding: 10px; position: relative;">
  <div class="search-container" style="position: relative; margin-bottom: 10px;">
      <input type="text" id="searchInput" placeholder="🔍 Tìm tên bài hát, lời nhạc..." autocomplete="off" style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
      <div id="searchSuggestions" class="suggestions-list"></div>
  </div>

  <div id="songTools" class="song-tools" style="display: none;">
      <div class="tool-group">
          <span>Tông:</span>
          <button onclick="transpose(-1)">-</button>
          <span id="currentKeyDisplay" class="badge-key">C</span>
          <button onclick="transpose(1)">+</button>
      </div>
      <div class="tool-group">
          <span>Cỡ chữ:</span>
          <button onclick="changeFontSize(-2)">A-</button>
          <button onclick="changeFontSize(2)">A+</button>
      </div>
  </div>
</div>

<div id="songView">
  <div class="song-title" id="title"></div>
  <div class="song-artist" id="artist"></div>
  <div class="song-content" id="content"></div>
</div>

<div class="song-list" id="list"></div>

<script src="songs.js"></script>
<script src="app.js"></script>

</body>
</html>
