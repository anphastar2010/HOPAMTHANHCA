<!DOCTYPE html>
<html lang="vi">
<head>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>Hợp Âm Thờ Phượng</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f9f9f9;
}

header {
  background: #1976d2;
  color: white;
  padding: 12px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.controls {
  display: flex;
  gap: 8px;
  padding: 10px;
}

select, input {
  flex: 1;
  padding: 10px;
  font-size: 16px;
}

.song-title {
  font-size: 22px;
  font-weight: bold;
  padding: 12px 12px 4px;
}

.song-artist {
  padding: 0 12px 12px;
  font-size: 14px;
  color: #666;
}

.song-content {
  padding: 14px;
  font-size: 18px;
  line-height: 1.75;
}

.song-line {
  margin-bottom: 6px;
}

/* ===== HỢP ÂM ===== */
.chord {
  color: #0d47a1;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 19px;
  letter-spacing: 0.5px;
}
/* ===== DANH SÁCH ===== */
.song-list {
  border-top: 1px solid #ddd;
}

.song-item {
  padding: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.song-item:hover {
  background: #e3f2fd;
}
</style>
</head>

<body>

<header>🎶 Hợp Âm Thờ Phượng</header>

<div class="controls-container" style="padding: 10px; position: relative;">
  <div class="search-container" style="position: relative; margin-bottom: 10px;">
      <input type="text" id="searchInput" placeholder="🔍 Tìm tên bài hát, lời nhạc..." autocomplete="off" style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
      <div id="searchSuggestions" class="suggestions-list"></div>
  </div>

  <<div id="songTools" class="song-tools" style="display: none;">
  <button onclick="showDirectory()" style="background: #656d78; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: auto;">← Danh sách</button>
  
  <div class="tool-group">
      <span>Tông:</span>
          <button onclick="transpose(-1)">-</button>
          <span id="currentKeyDisplay" class="badge-key">C</span>
          <button onclick="transpose(1)">+</button>
      </div>
      <div class="tool-group">
          <span>Cỡ chữ:</span>
          <button onclick="changeFontSize(-2)">A-</button>
          <button onclick="changeFontSize(2)">A+</button>
      </div>
  </div>
</div>
<div id="directoryContainer" class="directory-container" style="padding: 10px;">
    </div>
<div id="songDisplay" class="song-display" style="padding: 14px;">
    <h2 id="displayTitle" class="song-title" style="padding:0; margin-bottom:4px;"></h2>
    <div id="displayArtist" class="song-artist" style="padding:0; margin-bottom:15px; color:#666;"></div>
    <pre id="displayContent" style="font-family: 'JetBrains Mono', monospace; font-weight: 600; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; margin: 0; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #eee;"></pre>
</div>
<script src="songs.js"></script>
<script src="app.js"></script>

</body>
</html>
