<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Thư viện hợp âm và lời bài hát thờ phượng.">
  <title>Hợp Âm Thờ Phượng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>🎶 Hợp Âm Thờ Phượng</h1></header>
  <main>
    <section class="controls-container" aria-label="Tìm kiếm và công cụ bài hát">
      <div class="search-container">
        <label class="sr-only" for="searchInput">Tìm bài hát</label>
        <input type="search" id="searchInput" placeholder="Tìm tên bài hát, lời nhạc hoặc tác giả" autocomplete="off" aria-controls="searchSuggestions" aria-describedby="searchStatus">
        <p id="searchStatus" class="sr-only" aria-live="polite"></p>
        <div id="searchSuggestions" class="suggestions-list" role="region" aria-label="Kết quả tìm kiếm"></div>
      </div>
      <div id="songTools" class="song-tools" style="display:none">
        <button type="button" id="backDirectoryBtn" class="back-button">← Danh sách</button>
        <div class="tool-group" aria-label="Đổi tông"><span>Tông:</span><button type="button" id="transposeDownBtn" aria-label="Giảm một nửa cung">−</button><output id="currentKeyDisplay" class="badge-key" title="Bấm để về tông gốc">C</output><button type="button" id="transposeUpBtn" aria-label="Tăng một nửa cung">+</button><button type="button" id="transposeResetBtn" aria-label="Về tông gốc">Gốc</button></div>
        <div class="tool-group" aria-label="Cỡ chữ"><span>Cỡ chữ:</span><button type="button" id="fontDownBtn" aria-label="Giảm cỡ chữ">A−</button><button type="button" id="fontUpBtn" aria-label="Tăng cỡ chữ">A+</button></div>
      </div>
    </section>
    <section id="directoryContainer" class="directory-container" aria-label="Danh sách bài hát"></section>
    <article id="songDisplay" class="song-display" style="display:none">
      <h2 id="displayTitle" class="song-title"></h2>
      <p id="displayArtist" class="song-artist"></p>
      <div class="media-controls"><div id="audioContainer" class="audio-container"></div><button type="button" id="viewSheetBtn" class="sheet-button">📄 Xem Sheet PDF</button><audio id="audioElement" style="display:none" controls></audio></div>
      <pre id="displayContent" tabindex="0"></pre>
    </article>
  </main>
  <script src="songs.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
