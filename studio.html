<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song Studio</title><style>body{font:15px system-ui;margin:0;background:#f4f7fb;color:#182838}header{background:#164c78;color:#fff;padding:20px}main{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.card{background:#fff;border:1px solid #d5e0ec;border-radius:12px;padding:15px}.row{display:flex;gap:9px}.row>*{flex:1}input,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #bac9d8;border-radius:7px;font:inherit}textarea{min-height:280px;font-family:monospace;line-height:1.7}button{padding:9px 12px;border:0;border-radius:7px;background:#19669f;color:#fff;font-weight:700;cursor:pointer}.list{max-height:580px;overflow:auto}.song{display:block;width:100%;margin:6px 0;text-align:left;background:#fff;color:#182838;border:1px solid #d5e0ec}.song.active{background:#e8f3fb;border-color:#19669f}.preview{white-space:pre-wrap;line-height:2;background:#fffdf8;border:1px solid #eadfcf;border-radius:8px;padding:12px}.chord{background:#fff0d2;color:#8a5005;border:1px solid #e8c586;border-radius:4px;padding:1px 4px;font-family:monospace;font-weight:700}.muted{color:#63758a;font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style><body><header><h1>🎼 Song Studio</h1><p>Nhập MusicXML MuseScore · chỉnh lời & hợp âm · xuất songs.js</p></header><main><div class="card"><div class="row"><div><b>Nhập MusicXML</b><input id="xml" type="file" accept=".musicxml,.xml"><p class="muted">Xuất MusicXML không nén từ MuseScore.</p></div><div><b>Thao tác</b><p><button id="new">+ Bài mới</button> <button id="out">⬇ Xuất songs.js</button></p><p id="status" class="muted"></p></div></div></div><div class="card"><b>Dán nội dung đã sao chép</b><label>URL nguồn<input id="sourceUrl" placeholder="https://hopamchuan.com/song/"></label><label>Lời và hợp âm<textarea id="hacPaste" style="min-height:110px"></textarea></label><button id="importPaste" type="button">Đưa vào trình chỉnh sửa</button></div><div class="card"><b>Cộng tác</b><label>Tên người sửa<input id="editorName"></label><p><a href="songs.js" download><button type="button">⬇ Tải songs.js mới nhất</button></a> <button id="exportChanges" type="button">Xuất changeset</button></p><p id="collabStatus" class="muted"></p></div><div class="grid"><aside class="card"><b>Thư viện hiện có</b><input id="search" placeholder="Tìm bài hát"><div id="list" class="list"></div></aside><section class="card"><h2 id="heading">Thêm bài hát</h2><div class="row"><label>Tên bài<input id="title"></label><label>Tác giả<input id="artist"></label><label>Giọng<input id="key" placeholder="C"></label></div><div class="row"><label>Audio<input id="audio"></label><label>Sheet PDF<input id="sheet"></label></div><label>Lời và hợp âm<textarea id="content" placeholder="[C]Lời bài hát [Am]có hợp âm"></textarea></label><p id="valid" class="muted"></p><p><button id="save">Lưu vào thư viện tạm</button> <button id="remove">Xóa</button> <button id="undo">Hoàn tác</button></p><b>Xem trước</b><div id="preview" class="preview"></div></section></div></main><script src="songs.js"></script><script>let lib=Array.isArray(songs)?structuredClone(songs):[],id=null,h=[];const q=x=>document.getElementById(x);const fields=["title","artist","key","audio","sheet","content"];function esc(s){return String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}function draw(){let x=q("search").value.toLowerCase();q("list").innerHTML="";lib.filter(s=>(s.title+s.artist+s.content).toLowerCase().includes(x)).sort((a,b)=>a.title.localeCompare(b.title,"vi")).forEach(s=>{let b=document.createElement("button");b.className="song"+(s.id===id?" active":"");b.textContent=s.title+" · "+(s.artist||"Chưa rõ");b.onclick=()=>load(s);q("list").append(b)})}function load(s){id=s.id;fields.forEach(k=>q(k).value=s[k]||"");q("heading").textContent="Chỉnh sửa: "+s.title;draw();check()}function blank(){id=null;fields.forEach(k=>q(k).value="");q("heading").textContent="Thêm bài hát";check();draw()}function check(){let t=q("content").value;q("preview").innerHTML=esc(t).replace(/\[([^\]]+)\]/g,"<span class=chord>$1</span>");q("valid").textContent=!q("title").value.trim()||!t.trim()?"Cần tên bài và nội dung.":/\[[^\]]*(?:$|\n)/.test(t)?"Thiếu dấu ] trong hợp âm.":"Sẵn sàng lưu."}function save(){if(!q("title").value.trim()||!q("content").value.trim())return check();h.push(JSON.stringify(lib));let s={id:id||Date.now()};fields.forEach(k=>s[k]=q(k).value.trim());s.key=s.key||"C";let i=lib.findIndex(x=>x.id===s.id);changes.push({op:i<0?"create":"update",song:s});i<0?lib.push(s):lib[i]=s;load(s);q("status").textContent="Đã lưu tạm. Xuất songs.js khi hoàn tất."}let changes=[];function importPasted(){let raw=q("hacPaste").value.trim();if(!raw)return;q("content").value=raw;q("sourceUrl").value=q("sourceUrl").value;check()}function exportChanges(){let who=q("editorName").value.trim();if(!who){q("collabStatus").textContent="Nhập tên người sửa.";return}let b=new Blob([JSON.stringify({author:who,exportedAt:new Date().toISOString(),changes:changes},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="changeset-"+Date.now()+".json";a.click();q("collabStatus").textContent="Đã xuất changeset."}function xml(file){let r=new FileReader();r.onload=()=>{let d=new DOMParser().parseFromString(r.result,"text/xml");if(d.querySelector("parsererror")){q("status").textContent="File XML không hợp lệ.";return}let lines={},pending=[];d.querySelectorAll("part:first-of-type measure").forEach(m=>m.children.forEach(n=>{if(n.tagName==="harmony"){let root=n.querySelector("root-step")?.textContent||"";let a=Number(n.querySelector("root-alter")?.textContent||0);let kind=n.querySelector("kind");pending.push(root+(a===1?"#":a===-1?"b":"")+(kind?.getAttribute("text")||({minor:"m",dominant:"7",major:""}[kind?.textContent]||"")))}if(n.tagName==="note")n.querySelectorAll("lyric").forEach(l=>{let no=l.getAttribute("number")||"1",w=l.querySelector("text")?.textContent;if(w){lines[no]=(lines[no]||"")+(pending.map(c=>"["+c+"]").join(""))+w+" ";pending=[]}})}));blank();q("title").value=d.querySelector("work-title")?.textContent||file.name.replace(/\.musicxml?$/i,"");q("artist").value=d.querySelector('creator[type="composer"]')?.textContent||"";q("key").value={"0":"C","1":"G","2":"D","3":"A","4":"E","-1":"F","-2":"Bb","-3":"Eb"}[d.querySelector("key fifths")?.textContent]||"C";q("content").value=Object.keys(lines).sort().map(no=>no+". "+lines[no].trim()).join("\n\n");check();q("status").textContent="Đã nhập MusicXML; hãy kiểm tra rồi lưu."};r.readAsText(file)}q("xml").onchange=e=>e.target.files[0]&&xml(e.target.files[0]);q("importPaste").onclick=importPasted;q("exportChanges").onclick=exportChanges;q("search").oninput=draw;fields.forEach(k=>q(k).oninput=check);q("new").onclick=blank;q("save").onclick=save;q("remove").onclick=()=>{if(!id)return;h.push(JSON.stringify(lib));lib=lib.filter(s=>s.id!==id);blank()};q("undo").onclick=()=>{if(h.length){lib=JSON.parse(h.pop());blank()}};q("out").onclick=()=>{let b=new Blob(["const songs = "+JSON.stringify(lib,null,2)+";\n"],{type:"text/javascript"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="songs.js";a.click()};draw();blank();q("status").textContent="Đã nạp "+lib.length+" bài từ songs.js."</script></body></html>
