<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song Studio</title><link rel="stylesheet" href="studio.css"></head><body><header><h1>🎼 Song Studio</h1><p>Nhập MusicXML MuseScore · chỉnh lời & hợp âm · xuất songs.js</p></header><main><div class="card row"><div><b>Nhập MusicXML</b><input id="xml" type="file" accept=".musicxml,.xml"></div><div><button id="new">+ Bài mới</button> <button id="out">⬇ Xuất songs.js</button><p id="status" class="muted"></p></div></div><div class="card"><b>Dán nội dung đã sao chép</b><label>URL nguồn<input id="sourceUrl"></label><label>Lời và hợp âm<textarea id="hacPaste"></textarea></label><button id="importPaste">Đưa vào trình chỉnh sửa</button></div><div class="card"><b>Cộng tác</b><label>Tên người sửa<input id="editorName"></label><button id="exportChanges">Xuất changeset</button><p id="collabStatus" class="muted"></p></div><div class="grid"><aside class="card"><b>Thư viện</b><input id="search" placeholder="Tìm bài hát"><div id="list" class="list"></div></aside><section class="card"><h2 id="heading">Thêm bài hát</h2><div class="row"><label>Tên bài<input id="title"></label><label>Tác giả<input id="artist"></label><label>Giọng<input id="key"></label></div><div class="row"><label>Audio<input id="audio"></label><label>Sheet PDF<input id="sheet"></label></div><label>Lời và hợp âm<textarea id="content"></textarea></label><p id="valid" class="muted"></p><button id="save">Lưu tạm</button> <button id="remove">Xóa</button> <button id="undo">Hoàn tác</button><h3>Xem trước</h3><div id="preview" class="preview"></div></section></div></main><script src="songs.js"></script><script src="data-revision.js"></script><script type="module" src="studio.js"></script></body></html>
